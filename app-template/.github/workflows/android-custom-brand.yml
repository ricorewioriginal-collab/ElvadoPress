name: Android custom brand

# Baut die Android-App einer einzelnen Marke aus android/brands.json (gestartet vom Build-Assistenten im CMS: Apps → Eigene App bauen).
# Das Ergebnis liegt als Pre-Release „app-<marke>-<nr>“ mit der APK im Repository; das CMS listet und liefert sie aus.
run-name: App ${{ inputs.brand }}

on:
  workflow_dispatch:
    inputs:
      brand:
        description: 'Marken-ID aus android/brands.json'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-custom-${{ inputs.brand }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BRAND: ${{ inputs.brand }}
      ANDROID_DEVELOPER_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEVELOPER_KEYSTORE_BASE64 }}
      ANDROID_DEVELOPER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEVELOPER_KEYSTORE_PASSWORD }}
      ANDROID_DEVELOPER_KEY_ALIAS: ${{ secrets.ANDROID_DEVELOPER_KEY_ALIAS }}
      ANDROID_DEVELOPER_KEY_PASSWORD: ${{ secrets.ANDROID_DEVELOPER_KEY_PASSWORD }}
      ANDROID_DEVELOPER_KEYSTORE_PATH: ${{ github.workspace }}/android/developer.jks
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Marke prüfen
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BRAND" =~ ^[a-z][a-z0-9]{2,19}$ ]] || { echo "Ungültige Marken-ID: $BRAND"; exit 1; }

      - uses: actions/checkout@v7

      - name: Marke in android/brands.json vorhanden?
        run: |
          jq -e --arg b "$BRAND" 'any(.[]; .id == $b)' android/brands.json > /dev/null || { echo "Marke $BRAND steht nicht in android/brands.json"; exit 1; }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Signatur-Schlüssel (falls als Secret hinterlegt)
        if: env.ANDROID_DEVELOPER_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_DEVELOPER_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_DEVELOPER_KEYSTORE_PATH"

      - name: Marken-Bilder bereitstellen
        run: |
          set -euo pipefail
          mkdir -p "android/app/src/$BRAND/res/drawable-nodpi" "android/app/src/$BRAND/assets/config"
          if [[ -f "brands/$BRAND/app_logo.png" ]]; then
            cp "brands/$BRAND/app_logo.png" "android/app/src/$BRAND/res/drawable-nodpi/app_logo.png"
            echo "Eigenes Icon: ja"
          else
            cp icon-512.png "android/app/src/$BRAND/res/drawable-nodpi/app_logo.png"
            echo "Eigenes Icon: nein (Standard-Icon)"
          fi
          for f in logo-lockup startscreen; do
            [[ -f "brands/$BRAND/$f.png" ]] && cp "brands/$BRAND/$f.png" "android/app/src/$BRAND/assets/config/$f.png" || true
          done

      - name: APK bauen
        run: |
          set -euo pipefail
          CAP="$(printf '%s' "${BRAND:0:1}" | tr '[:lower:]' '[:upper:]')${BRAND:1}"
          gradle -p android --no-daemon "assemble${CAP}Developer"
          APK="android/app/build/outputs/apk/$BRAND/developer/app-$BRAND-developer.apk"
          test -f "$APK"
          PREFIX="$(jq -r --arg b "$BRAND" '.[] | select(.id == $b) | .filePrefix' android/brands.json)"
          mkdir -p dist
          cp "$APK" "dist/$PREFIX-Developer.apk"
          echo "APK_FILE=dist/$PREFIX-Developer.apk" >> "$GITHUB_ENV"

      - name: Als Pre-Release bereitstellen
        run: |
          set -euo pipefail
          TAG="app-$BRAND-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" "$APK_FILE" --prerelease --title "App $BRAND (Build $GITHUB_RUN_NUMBER)" --notes "Gebaut vom Build-Assistenten im CMS. Entwickler-APK: ohne Play-Store-Signatur."
