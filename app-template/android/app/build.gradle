plugins {
    id 'com.android.application'
}

def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
// Nicht "keyAlias"/"keyPassword" nennen: lokale Variablen gleichen Namens verdecken im signingConfigs-Block die Gradle-Befehle gleichen Namens
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning = keystorePath && keystorePassword && releaseKeyAlias && releaseKeyPassword

def developerKeystorePath = System.getenv("ANDROID_DEVELOPER_KEYSTORE_PATH")
def developerKeystorePassword = System.getenv("ANDROID_DEVELOPER_KEYSTORE_PASSWORD")
def developerKeyAlias = System.getenv("ANDROID_DEVELOPER_KEY_ALIAS")
def developerKeyPassword = System.getenv("ANDROID_DEVELOPER_KEY_PASSWORD")
def hasDeveloperSigning = developerKeystorePath && developerKeystorePassword && developerKeyAlias && developerKeyPassword
def ciVersionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

// Multi-Brand: Eine Code-Basis, mehrere Apps. Jede Marke aus android/brands.json wird ein
// Product Flavor mit eigener Paket-ID, eigenem App-Namen, eigener Start-URL und eigenen
// Branding-Dateien (android/app/src/<id>/res bzw. assets). Das CMS (Apps → Eigene App bauen) trägt die Marken ein.
def brandList = new groovy.json.JsonSlurper().parse(file("../brands.json"))

android {
    namespace 'app.elvadopress.client'

    sourceSets {
        main {
            assets.srcDirs += ['../../android-app/assets']
        }
    }
    compileSdk 36

    buildFeatures {
        // Marken-Strings (app_name, launch_url, asset_statements) kommen aus android/brands.json per resValue
        resValues true
        buildConfig true
    }

    defaultConfig {
        applicationId 'app.elvadopress.client'
        minSdk 23
        targetSdk 36
        versionCode ciVersionCode
        versionName '3.0.0'
    }

    flavorDimensions = ['brand']
    productFlavors {
        brandList.each { b ->
            create(b.id) {
                dimension 'brand'
                applicationId b.applicationId
                resValue 'string', 'app_name', b.appName
                resValue 'string', 'launch_url', b.launchUrl
                resValue 'string', 'site_base', b.site
                resValue 'string', 'theme_color', (b.themeColor ?: '#070A1C')   // Statusleiste/Hintergrund (App-Typ web)
                buildConfigField 'String', 'APP_TYPE', '"' + (b.type == 'content' ? 'content' : 'web') + '"'   // web = Website als App (Standard), content = Baukasten-App (Tab-Leiste mit eigenen Inhalten)
                resValue 'string', 'asset_statements', '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"web","site":"' + b.site + '"}}]'
            }
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        if (hasDeveloperSigning) {
            developer {
                storeFile file(developerKeystorePath)
                storePassword developerKeystorePassword
                keyAlias developerKeyAlias
                keyPassword developerKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        developer {
            initWith debug
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            debuggable true
            signingConfig hasDeveloperSigning ? signingConfigs.developer : signingConfigs.debug
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
