name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, zip, mbstring, pdo_sqlite
      - name: PHP-Syntax prüfen
        run: find cms scripts -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Testinstallation (Einrichtung, Verwaltung, Radio-Erweiterungen)
        run: php scripts/smoke-test.php
      - name: Alle Tests
        run: |
          fail=0
          for t in scripts/test-*.php; do
            echo "== $t"
            if ! php "$t" > "$RUNNER_TEMP/out.txt" 2>&1; then echo "FEHLGESCHLAGEN: $t"; tail -20 "$RUNNER_TEMP/out.txt"; fail=1; else tail -1 "$RUNNER_TEMP/out.txt"; fi
          done
          exit $fail
