name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, zip, mbstring, pdo_sqlite
      - name: PHP-Syntax prüfen
        run: find cms -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Testinstallation
        run: php scripts/smoke-test.php
